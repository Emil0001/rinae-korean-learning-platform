services:
  postgres:
    image: postgres:16-alpine
    container_name: rinae-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rinae_korean
      POSTGRES_USER: rinae
      POSTGRES_PASSWORD: rinae_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
